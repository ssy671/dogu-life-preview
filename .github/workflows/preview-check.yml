name: Check preview URL
on:
  workflow_call:
    inputs:
      fingerprint:
        type: string
        required: false
        default: ''
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    name: Check ${{ matrix.site }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - site: github
            url: https://ssy671.github.io/dogu-life-preview/
          - site: pages
            url: https://lifehint-daily.pages.dev/
    env:
      BLOG_CHECK_URL: ${{ matrix.url }}
      BLOG_EXPECTED_BUILD: ${{ inputs.fingerprint }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify the deployed version, images, data, and article URLs
        run: python scripts/check_live.py
      - name: Install the production browser check
        if: matrix.site == 'pages'
        run: |
          python -m pip install playwright
          python -m playwright install chromium
      - name: Verify production desktop and mobile behavior
        if: matrix.site == 'pages'
        run: python tests/browser_check.py
      - uses: actions/upload-artifact@v4
        if: always() && matrix.site == 'pages'
        with:
          name: blog-screen-check-${{ matrix.site }}
          path: artifacts/
          retention-days: 3
