name: Check preview URL
on:
  push:
    branches: [main]
    paths: [.github/workflows/preview-check.yml]
  workflow_run:
    workflows: ["pages build and deployment"]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify published homepage and assets
        shell: python
        run: |
          import time, urllib.request, urllib.error
          base = "https://ssy671.github.io/dogu-life-preview/"
          paths = {"": ("도구생활", "text/html"), "static/style.css": ("--ink", "text/css"), "post/organize-work-folders/": ("파일", "text/html")}
          for attempt in range(1, 9):
              errors = []
              for path, (expected, content_type) in paths.items():
                  url = base + path
                  try:
                      request = urllib.request.Request(url, headers={"Cache-Control": "no-cache", "User-Agent": "Dogu-Life-Preview-Check"})
                      with urllib.request.urlopen(request, timeout=20) as response:
                          body = response.read().decode("utf-8")
                          status = response.status
                          actual = response.headers.get("Content-Type", "")
                          print(f"{url} -> HTTP {status} {actual}", flush=True)
                          if status != 200 or expected not in body or content_type not in actual:
                              errors.append(f"{path}: unexpected content or status")
                  except Exception as error:
                      errors.append(f"{path}: {error}")
                      print(f"{url} -> {error}", flush=True)
              if not errors:
                  print("PASS: homepage, CSS, and article are publicly available.", flush=True)
                  with open(__import__("os").environ["GITHUB_STEP_SUMMARY"], "a") as summary:
                      summary.write("Preview is available: " + base + "\n\nHomepage, CSS, and article returned HTTP 200.\n")
                  break
              if attempt == 8:
                  raise SystemExit("\n".join(errors))
              print("Waiting for deployment propagation...", flush=True)
              time.sleep(15)
