name: Check preview URL
on:
  push:
    branches: [main]
    paths: [.github/workflows/preview-check.yml, scripts/check_live.py, tests/browser_check.py]
  workflow_run:
    workflows: ["pages build and deployment", "Publish daily articles and refresh views"]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    name: Check ${{ matrix.site }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - site: github
            url: https://ssy671.github.io/dogu-life-preview/
          - site: pages
            url: https://lifehint-daily.pages.dev/
    env:
      BLOG_CHECK_URL: ${{ matrix.url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify live homepage, images, data, and all article URLs
        run: python scripts/check_live.py
      - name: Install browser test dependency
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Verify sorting and filters on desktop and mobile
        run: python tests/browser_check.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: blog-screen-check-${{ matrix.site }}
          path: artifacts/
          retention-days: 3
