name: Check Workers static deployment
on:
  push:
    branches: [main]
    paths:
      - scripts/build.py
      - wrangler.jsonc
      - .github/workflows/worker-check.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build the site at its Workers root
        env:
          WORKERS_CI: '1'
        run: python3 scripts/build.py
      - name: Validate static assets without publishing
        run: npx --yes wrangler@4 deploy --dry-run --outdir /tmp/lifehint-worker-check
